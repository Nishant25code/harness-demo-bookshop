<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bookshop{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="/">📚 Bookshop</a>
    <form class="search" action="/search" method="get">
      <input type="search" name="q" placeholder="Search books or authors" value="{{ request.args.get('q', '') }}">
      <button>Search</button>
    </form>
    <a class="cart-link" href="/cart">Cart</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Demo bookshop · all prices in USD</footer>
</body>
</html>
